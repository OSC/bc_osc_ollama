---
cluster:
  - "ascend"
  - "cardinal"
form:
  - auto_accounts
  - auto_modules_ollama
  - num_cores
  - node_type
  - bc_num_hours
  - bc_email_on_started
attributes:
  auto_modules_ollama:
    default: false
  num_cores:
    widget: "number_field"
    label: "Number of cores"
    value: 1
    help: |
      Number of cores on node type (4 GB per core unless requesting whole
      node). Leave blank if requesting full node.
    min: 1
    max: 28
    step: 1
  node_type:
    widget: select
    label: "Node type"
    help: |
      - **Standard Compute** <br>
        Chosing "any" as the node type will decrease your wait time.
      - **GPU Enabled** <br>
        These are HPC machines with GPUs. They have the same
        CPU and memory characteristics of standard compute.
      - **Large Memory** <br>
        These are HPC machines with very large amounts of memory.
    options:
      - [
          "any",     "any",
          data-min-num-cores-for-cluster-ascend: 1,
          data-max-num-cores-for-cluster-ascend: 84,
          data-min-num-cores-for-cluster-cardinal: 1,
          data-max-num-cores-for-cluster-cardinal: 96,
        ]
      - [
          "40 core",     "any-40core",
          data-min-num-cores-for-cluster-pitzer: 1,
          data-max-num-cores-for-cluster-pitzer: 40,
          data-option-for-cluster-ascend: false,
          data-option-for-cluster-cardinal: false,
        ]
      - [
          "48 core",     "any-48core",
          data-min-num-cores-for-cluster-pitzer: 1,
          data-max-num-cores-for-cluster-pitzer: 48,
          data-option-for-cluster-ascend: false,
          data-option-for-cluster-cardinal: false,
        ]
      - [
          "any gpu",     "gpu",
          data-min-num-cores-for-cluster-ascend: 1,
          data-max-num-cores-for-cluster-ascend: 88,
          data-min-num-cores-for-cluster-cardinal: 1,
          data-max-num-cores-for-cluster-cardinal: 96,
        ]
      - [
          "40 core gpu",     "gpu-40core",
          data-min-num-cores-for-cluster-pitzer: 1,
          data-max-num-cores-for-cluster-pitzer: 40,
          data-option-for-cluster-ascend: false,
          data-option-for-cluster-cardinal: false,
        ]
      - [
          "48 core gpu",     "gpu-48core",
          data-min-num-cores-for-cluster-pitzer: 1,
          data-max-num-cores-for-cluster-pitzer: 48,
          data-option-for-cluster-ascend: false,
          data-option-for-cluster-cardinal: false,
        ]
