---
cluster:
  - "ascend"
  - "cardinal"
form:
  - auto_modules_ollama
  - auto_accounts
  - ollama_models
  - global_job_type
  - global_enable_mem
  - global_num_cores
  - bc_num_hours
  - global_mem
  - global_gpus
  - global_gpu_type
  - global_enable_debug
  - bc_email_on_started
  - global_default_values     # required if the global_job_type is used
attributes:
  auto_modules_ollama:
    default: false
    filter: "0.1|0.40.6|0.5.13"
    help: "This defines the version of Ollama you want to load."
    label: "Ollama version"
  ollama_models:
    widget: "path_selector"
    label: "Ollama Models Directory"
    show_hidden: false
    show_files: false
    help: "Select where to read/write models; Defaults to the unwritable public central model directory"
